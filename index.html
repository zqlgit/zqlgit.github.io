<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ChemAI +70 — 一个简单的个人主页">
  <title>ChemAI +70</title>
  <style>
    :root {
      --sky-50: #f4faff;
      --sky-100: #e3f3ff;
      --sky-200: #cbe7fb;
      --sky-300: #a9d6f5;
      --ink-900: #083b60;
      --ink-600: #1a6ea8;
      --ink-400: #4d9ed4;
      --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei",
        system-ui, -apple-system, sans-serif;
      color: var(--ink-900);
      background:
        radial-gradient(60rem 60rem at 12% 8%, #ffffff 0%, rgba(255, 255, 255, 0) 55%),
        radial-gradient(55rem 55rem at 88% 92%, #bfe2fb 0%, rgba(191, 226, 251, 0) 60%),
        linear-gradient(160deg, var(--sky-50) 0%, var(--sky-100) 42%, var(--sky-200) 100%);
      -webkit-font-smoothing: antialiased;
    }

    /* 柔和光斑，增加浅蓝层次 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 42vmax;
      height: 42vmax;
      top: -14vmax;
      left: -12vmax;
      background: rgba(255, 255, 255, 0.75);
    }

    body::after {
      width: 38vmax;
      height: 38vmax;
      right: -12vmax;
      bottom: -16vmax;
      background: rgba(128, 197, 240, 0.35);
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.2rem, 3.5vw, 2.4rem);
      padding: 8vw 6vw;
      text-align: center;
    }

    .hero {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(0.45rem, 1.8vw, 1.6rem);
      font-size: clamp(2.7rem, 11.5vw, 8.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
    }

    .word {
      display: inline-block;
      will-change: transform, opacity;
    }

    .word--left {
      color: var(--ink-900);
      background: linear-gradient(120deg, #07395d 0%, #1c7ab8 60%, #3ea2dc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: slide-from-left 1.9s var(--ease-out-soft) both;
    }

    .word--right {
      color: var(--ink-400);
      background: linear-gradient(120deg, #2e8ecb 0%, #6cbdf0 70%, #9ad6fb 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: slide-from-right 1.9s var(--ease-out-soft) both;
    }

    /* 落位后淡淡的辉光 */
    .glow {
      position: absolute;
      left: 50%;
      top: 40%;
      width: min(88vw, 64rem);
      height: min(30vw, 16rem);
      transform: translate(-50%, -50%) scale(0.6);
      background: radial-gradient(
        closest-side,
        rgba(86, 175, 231, 0.28),
        rgba(86, 175, 231, 0) 72%
      );
      filter: blur(18px);
      opacity: 0;
      z-index: -1;
      animation: glow-in 1.6s ease-out 1.15s both;
    }

    .tagline {
      font-size: clamp(0.85rem, 2.1vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: var(--ink-600);
      opacity: 0;
      animation: fade-up 1.1s ease-out 1.35s both;
    }

    .tagline::after {
      content: "";
      display: block;
      width: 3.2rem;
      height: 2px;
      margin: 1.1rem auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--ink-400), transparent);
    }

    @keyframes slide-from-left {
      from {
        opacity: 0;
        transform: translate3d(-72vw, 0, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes slide-from-right {
      from {
        opacity: 0;
        transform: translate3d(72vw, 0, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes glow-in {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
      }
      55% {
        opacity: 1;
      }
      100% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(0.8rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .word--left,
      .word--right,
      .glow,
      .tagline {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .glow {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <span class="glow" aria-hidden="true"></span>
    <h1 class="hero">
      <span class="word word--left">ChemAI</span>
      <span class="word word--right">+70</span>
    </h1>
    <p class="tagline">Chemistry &amp; Artificial Intelligence</p>
  </main>
</body>
</html>
